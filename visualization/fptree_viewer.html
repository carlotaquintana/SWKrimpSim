<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FP-Tree Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #14181c;
    --panel: #1c2228;
    --border: #2a323b;
    --text: #d8dee5;
    --text-dim: #8b96a3;
    --accent-cold: #5eead4;
    --accent-hot: #E39236;
    --mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Consolas, monospace;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
  }

  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }

  #topbar h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--text);
    white-space: nowrap;
  }

  #topbar h1 span {
    color: var(--text-dim);
    font-weight: 400;
    font-family: var(--mono);
    font-size: 12px;
    margin-left: 8px;
  }

  .file-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .file-btn:hover { border-color: var(--accent-cold); }
  .file-btn input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }

  #status {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }

  #legend {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }

  #legend .bar {
    width: 120px;
    height: 9px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent-hot), var(--accent-cold));
  }

  #canvas-wrap {
    position: absolute;
    top: 56px; left: 0; right: 0; bottom: 0;
  }

  svg { width: 100%; height: 100%; cursor: grab; }
  svg:active { cursor: grabbing; }

  .link {
    fill: none;
    stroke: #3a4552;
    stroke-width: 1.6px;
  }

  .cluster {
    stroke-width: 1.8px;
    transition: stroke-width 0.15s ease;
  }

  .node:hover .cluster {
    stroke-width: 3px;
  }

  .node text.item-label {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    fill: var(--text);
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .node text.usage-label {
    font-family: var(--mono);
    font-size: 10px;
    fill: var(--text-dim);
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  #tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    display: none;
    z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    min-width: 140px;
  }

  #tooltip .row { 
    display: flex; 
    justify-content: 
    space-between; 
    gap: 16px; 
    margin-top: 2px; 
  }

  #tooltip .row span:first-child { color: var(--text-dim); }

  #tooltip .head { 
    color: var(--accent-hot); 
    font-weight: 600; 
    margin-bottom: 4px; 
  }

  #empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 14px;
    text-align: center;
  }
  
  #empty-state strong { 
    color: var(--text); 
    font-family: var(--sans); 
    font-size: 15px; 
  }

</style>
</head>
<body>

<div id="topbar">
  <h1>SLIM Pattern Viewer <span id="filename"></span></h1>
  <label class="file-btn">
    Load JSON
    <input type="file" id="file-input" accept=".json" />
  </label>
  <div id="status">No data loaded</div>
  <div id="legend">
    <span>High frequency</span>
    <div class="bar"></div>
    <span>Low frequency</span>
  </div>
</div>

<div id="canvas-wrap">
  <div id="empty-state">
    <strong>No tree loaded</strong>
    <div>Load the output.json generated by FPTreeBuilder to visualize it here.</div>
  </div>
  <svg id="svg" style="display:none;"></svg>
</div>

<div id="tooltip"></div>

<script>
(function () {

  const svg = d3.select("#svg");
  const g = svg.append("g");
  const tooltip = d3.select("#tooltip");
  const NODE_SEP_Y = 70;
  const LEVEL_SEP_X = 260;

  const zoomBehavior = d3.zoom()
    .scaleExtent([0.1, 3])
    .on("zoom", (event) => g.attr("transform", event.transform));

  svg.call(zoomBehavior);

  const CHAR_WIDTH = 8.2;   // approximate character width in the mono font at 13px
  const CLUSTER_PAD_X = 22;
  const CLUSTER_HEIGHT = 44;
  const CLUSTER_MIN_WIDTH = 60;

  /**
   * Compresses the linear path into a single node with a list of items. 
   * If the node has multiple children, it is not compressed.
   */
  function compress(node) {

    const items = [node.item];
    let current = node;

    while (current.children && current.children.length === 1) {
      current = current.children[0];
      items.push(current.item);
    }

    const hasBranch = current.children && current.children.length > 1;
    const children = hasBranch ? current.children.map(compress) : [];

    return {
      items,
      usage: current.usage,
      support: current.support,
      children
    };
  }

  /**
   * Computes the width of the cluster based on the number of items and the usage/support text
   */
  function clusterWidth(d) {
    const itemsText = d.data.items.join(",");
    const usageText = `u:${d.data.usage} s:${d.data.support}`;
    const longest = Math.max(itemsText.length, usageText.length);
    return Math.max(CLUSTER_MIN_WIDTH, longest * CHAR_WIDTH + CLUSTER_PAD_X * 2);
  }

  /**
   * Renders the tree given the root node data.
   * The root node is a virtual node that has all the independent groups as children.
   */
  function renderTree(data) {

    document.getElementById("empty-state").style.display = "none";
    svg.style("display", "block");
    g.selectAll("*").remove();

    const realGroups = (data.children || []).map(compress); // skip -1 root node ROOT
    const virtualRoot = { items: [], usage: 0, support: 0, children: realGroups }; // to help d3 calculate positions

    const root = d3.hierarchy(virtualRoot, d => d.children);
    const realNodes = root.descendants().filter(d => d.depth > 0);

    const maxUsage = d3.max(realNodes, d => d.data.usage) || 1;
    const colorScale = d3.scaleSequential()
      .domain([0, maxUsage])
      .interpolator(d3.interpolateRgbBasis([getVar("--accent-cold"), getVar("--accent-hot")]));

    const treeLayout = d3.tree().nodeSize([NODE_SEP_Y, LEVEL_SEP_X]);

    treeLayout(root); // mutates the root with x/y positions

    const realLinks = root.links().filter(l => l.source.depth > 0); // {source, target}

    const linkGenerator = d3.linkHorizontal().x(d => d.y).y(d => d.x); // horizontal links

    g.append("g")
      .attr("class", "links")
      .selectAll("path")
      .data(realLinks)
      .join("path")
      .attr("class", "link")
      .attr("d", d => {
        const sw = clusterWidth(d.source) / 2;
        const tw = clusterWidth(d.target) / 2;
        return linkGenerator({
          source: { x: d.source.x, y: d.source.y + sw },
          target: { x: d.target.x, y: d.target.y - tw }
        });
      });

    const nodeGroup = g.append("g")
      .attr("class", "nodes")
      .selectAll("g")
      .data(realNodes)
      .join("g")
      .attr("class", "node")
      .attr("transform", d => `translate(${d.y},${d.x})`)
      .on("mouseenter", (event, d) => showTooltip(event, d))
      .on("mousemove", (event) => moveTooltip(event))
      .on("mouseleave", hideTooltip);

    nodeGroup.append("rect")
      .attr("class", "cluster")
      .attr("x", d => -clusterWidth(d) / 2)
      .attr("y", -CLUSTER_HEIGHT / 2)
      .attr("width", d => clusterWidth(d))
      .attr("height", CLUSTER_HEIGHT)
      .attr("rx", CLUSTER_HEIGHT / 2)
      .attr("ry", CLUSTER_HEIGHT / 2)
      .attr("fill", d => colorScale(d.data.usage))
      .attr("fill-opacity", 0.16)
      .attr("stroke", d => colorScale(d.data.usage));

    nodeGroup.append("text")
      .attr("class", "item-label")
      .attr("y", -7)
      .text(d => d.data.items.join(","));

    nodeGroup.append("text")
      .attr("class", "usage-label")
      .attr("y", 11)
      .text(d => `u:${d.data.usage} s:${d.data.support}`);

    // Center the initial view on the first group
    const initialTransform = d3.zoomIdentity.translate(60, window.innerHeight / 2 - 56).scale(1);
    svg.call(zoomBehavior.transform, initialTransform);

    document.getElementById("status").textContent =
      `${realNodes.length} nodes · max usage: ${maxUsage}`;
  }

  // CSS -> JS
  function getVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function showTooltip(event, d) {
    tooltip.html(`
      <div class="head">${d.data.items.join(", ")}</div>
      <div class="row"><span>usage</span><span>${d.data.usage}</span></div>
      <div class="row"><span>support</span><span>${d.data.support}</span></div>
      <div class="row"><span>items in chain</span><span>${d.data.items.length}</span></div>
      <div class="row"><span>next branches</span><span>${d.children ? d.children.length : 0}</span></div>
    `).style("display", "block");
    moveTooltip(event);
  }

  function moveTooltip(event) {
    tooltip.style("left", (event.clientX + 16) + "px")
           .style("top", (event.clientY + 16) + "px");
  }

  function hideTooltip() {
    tooltip.style("display", "none");
  }

  // Load local file
  document.getElementById("file-input").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById("filename").textContent = file.name;
    document.getElementById("status").textContent = "Loading...";

    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const data = JSON.parse(event.target.result);
        renderTree(data);
      } catch (err) {
        document.getElementById("status").textContent = "Error parsing JSON: " + err.message;
      }
    };
    reader.readAsText(file);
  });

})();
</script>

</body>
</html>
